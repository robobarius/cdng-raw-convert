name: Feature request
description: An idea for something new or better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The task or workflow this would help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Camera modes, software you use with it, examples from other tools.
